[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-treatment-chatbot"
version = "6.0.0"
description = "Water-treatment RAG chatbot canonical runtime"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = [
  "config",
  "chatbot",
  "chatbot.analysis",
  "chatbot.chunking",
  "chatbot.core",
  "chatbot.document",
  "chatbot.embedding",
  "chatbot.filtering",
  "chatbot.generation",
  "chatbot.monitoring",
  "chatbot.pipeline",
  "chatbot.preprocessing",
  "chatbot.quality",
  "chatbot.reranking",
  "chatbot.retrieval"
]

[tool.setuptools.package-dir]
config = "config"
chatbot = "src/chatbot"

[tool.setuptools.package-data]
config = ["default.yaml"]
