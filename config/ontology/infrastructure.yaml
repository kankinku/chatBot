# Storage Configuration
storage:
  backend: "inmemory"  # inmemory | neo4j
  
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: "${NEO4J_PASSWORD}"
    database: "neo4j"

# LLM Configuration
llm:
  backend: "ollama"  # ollama | mock
  
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2"
    timeout: 30
  

