name: validate

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit-security:
    name: offline-unit-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Chatbot_v6/requirements-ci.lock

      - name: Install locked test dependencies
        run: cd Chatbot_v6 && python3 -m pip install pip==26.2.1 && python3 -m pip install -r requirements-ci.lock && python3 -m pip check

      - name: Compile Python sources
        run: cd Chatbot_v6 && python3 -m compileall -q Server/backend tests/unit modules config scripts

      - name: Run strict offline unit, security, and contract tests
        run: cd Chatbot_v6 && python3 -m pytest tests/unit -q -o addopts= -p no:cacheprovider
