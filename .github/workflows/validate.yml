name: validate

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit-security:
    name: offline-unit-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            Chatbot_v6/requirements-ci.lock

      - name: Install locked test dependencies
        run: python3 tools/validate.py install-ci

      - name: Compile Python sources
        run: python3 tools/validate.py compile

      - name: Run strict offline unit, security, and contract tests
        run: python3 tools/validate.py test
